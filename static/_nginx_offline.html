<!DOCTYPE html>
<!--
  Served by nginx when the application is unreachable (502/503/504).
  Deliberately self-contained: no stylesheet, no font, no image, because when
  this page is shown the thing that serves those may also be down.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Back shortly - XaninFarm</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #F7F4EC;
      color: #292524;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .card {
      max-width: 30rem;
      background: #fff;
      border-radius: 14px;
      padding: 48px 32px;
      box-shadow: 0 2px 14px rgba(41, 37, 36, .07);
    }
    h1 { margin: 0 0 12px; font-size: 26px; color: #14532D; }
    p  { margin: 0 0 8px; line-height: 1.6; color: #57534E; }
    .brand { font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: #15803D; }
  </style>
</head>
<body>
  <div class="card">
    <p class="brand">XaninFarm</p>
    <h1>We will be back shortly</h1>
    <p>The shop is briefly unavailable while we sort something out.</p>
    <p>Your basket and your orders are safe. Please try again in a few minutes.</p>
  </div>
</body>
</html>
