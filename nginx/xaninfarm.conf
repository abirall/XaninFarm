# XaninFarm site configuration.
#
# Replace xaninfarms.com with your domain. Until certificates exist, comment
# out the HTTPS server and the redirect, and let the HTTP server serve the app
# directly - otherwise nginx will fail to start on a missing certificate file.

upstream xaninfarm_app {
    server web:8000;
    keepalive 16;
}

# -----------------------------------------------------------------------------
# HTTP - ACME challenges, everything else redirected
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name xaninfarms.com www.xaninfarms.com;

    # Certbot webroot. Must stay reachable over plain HTTP for renewals.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Django also sets SECURE_SSL_REDIRECT; doing it here too means the
    # redirect happens before the request ever reaches a worker.
    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------------------
# HTTPS
# -----------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name xaninfarms.com www.xaninfarms.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # HSTS is also set by Django, but sending it from the edge covers responses
    # nginx serves itself, such as static files and error pages.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # -------------------------------------------------------------------------
    # Static and media, served by nginx rather than the application
    # -------------------------------------------------------------------------
    # Hashed filenames from ManifestStaticFilesStorage, so these are immutable
    # and safe to cache for a year.
    location /static/ {
        alias /var/www/static/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /var/www/media/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";

        # Uploads are never executable. Stops a file that slipped past
        # validation from being served as a script.
        location ~* \.(php|py|pl|sh|cgi|htaccess)$ {
            deny all;
        }
    }

    # -------------------------------------------------------------------------
    # Application
    # -------------------------------------------------------------------------
    location / {
        limit_req zone=general burst=60 nodelay;
        include /etc/nginx/proxy_params_xaninfarm;
    }

    # Brute-force protection on the credential endpoints.
    location ~ ^/account/(login|register|password/reset)/ {
        limit_req zone=login burst=5 nodelay;
        include /etc/nginx/proxy_params_xaninfarm;
    }

    location /api/ {
        limit_req zone=api burst=30 nodelay;
        include /etc/nginx/proxy_params_xaninfarm;
    }

    # Payment callbacks. Deliberately not rate limited: a gateway retrying a
    # webhook must not be throttled into giving up on a real payment. The
    # handler verifies the signature and is idempotent, which is the actual
    # defence here.
    location /payments/webhook/ {
        include /etc/nginx/proxy_params_xaninfarm;
    }

    # Health probe, kept out of the access log.
    location = /healthz/ {
        access_log off;
        include /etc/nginx/proxy_params_xaninfarm;
    }

    location = /favicon.ico { alias /var/www/static/img/favicon.svg; access_log off; }

    # Django renders its own branded error pages; only fall back to nginx's if
    # the application is completely unreachable.
    error_page 502 503 504 /_nginx_offline.html;
    location = /_nginx_offline.html {
        root /var/www/static;
        internal;
    }
}
