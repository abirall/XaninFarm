# Main nginx configuration for the XaninFarm production stack.
# The site itself lives in conf.d/default.conf (nginx/xaninfarm.conf).

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # $host, not $http_host, so a request with no Host header still logs.
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # Do not advertise the exact nginx version in responses or error pages.
    server_tokens   off;

    # Product images are the largest thing a staff member uploads. Django caps
    # uploads at 5 MB (DATA_UPLOAD_MAX_MEMORY_SIZE); this is the matching edge
    # limit, slightly higher to allow for multipart overhead.
    client_max_body_size 6m;
    client_body_timeout  30s;
    client_header_timeout 30s;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   512;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        image/svg+xml;

    # Rate limit zones. Applied per-location in the site config: login and the
    # payment webhook are the endpoints worth protecting from a flood.
    limit_req_zone $binary_remote_addr zone=login:10m  rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:10m    rate=60r/m;
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;

    include /etc/nginx/conf.d/*.conf;
}
