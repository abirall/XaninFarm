# =============================================================================
# XaninFarm - production stack
#
#   cp .env.example .env     # then set real secrets
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Differences from the development stack that matter:
#   * no source bind mount - the code is what was built into the image
#   * no published database or redis port - only the compose network reaches them
#   * nginx terminates HTTP and serves static and media directly
#   * every secret comes from .env, nothing is defaulted in this file
# =============================================================================

name: xaninfarm-prod

x-django-env: &django_env
  # env_file supplies the secrets; these are the values that must differ from
  # the developer defaults regardless of what .env says.
  DJANGO_SETTINGS_MODULE: config.settings.prod
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  WAIT_FOR_DB: "1"
  WAIT_FOR_REDIS: "1"

services:

  db:
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mount point for pg_dump output - see docs/backup.md.
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always

  web:
    build:
      context: .
      target: runtime
      args:
        REQUIREMENTS: prod
    env_file: .env
    environment:
      <<: *django_env
      # This is the only container that migrates and collects static files.
      RUN_MIGRATIONS: "1"
      RUN_COLLECTSTATIC: "1"
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/mediafiles
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  worker:
    build:
      context: .
      target: runtime
      args:
        REQUIREMENTS: prod
    command: celery -A config worker --loglevel=warning --concurrency=4 --max-tasks-per-child=200
    env_file: .env
    environment:
      <<: *django_env
      RUN_MIGRATIONS: "0"
      RUN_COLLECTSTATIC: "0"
    volumes:
      # Writable: tasks that generate invoices or resize images write here.
      - media_files:/app/mediafiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started
    restart: always

  beat:
    build:
      context: .
      target: runtime
      args:
        REQUIREMENTS: prod
    command: celery -A config beat --loglevel=warning --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    environment:
      <<: *django_env
      RUN_MIGRATIONS: "0"
      RUN_COLLECTSTATIC: "0"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started
    restart: always

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/xaninfarm.conf:/etc/nginx/conf.d/default.conf:ro
      # Shared proxy settings, included by every proxying location block.
      - ./nginx/proxy_params:/etc/nginx/proxy_params_xaninfarm:ro
      # Read-only: nginx serves these, the app writes them.
      - static_files:/var/www/static:ro
      - media_files:/var/www/media:ro
      # TLS certificates. Point this at your certbot live directory.
      - ./nginx/certs:/etc/nginx/certs:ro
      # Webroot for ACME HTTP-01 challenges during certificate renewal.
      - certbot_webroot:/var/www/certbot
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
    restart: always

volumes:
  postgres_data:
  redis_data:
  static_files:
  media_files:
  certbot_webroot:
